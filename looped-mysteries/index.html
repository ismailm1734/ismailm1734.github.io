<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Looped Mysteries · Answers</title>
<meta name="description" content="Answers to the Looped Mysteries picture puzzles from Instagram." />
<meta name="theme-color" content="#0b0e24" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Crimson+Pro:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet" />
<style>
:root { --gold: #e7bf55; --gold-mid: #c99a35; --gold-deep: #7d5a1a; --ink: #0b0e24; --text: #f6eed8; --muted: #b9b39a; --wine: #8b1a2b; }
* { box-sizing: border-box; }
body { margin: 0; background: radial-gradient(ellipse 120% 50% at 50% 0%, #1d2a6e 0%, var(--ink) 60%) fixed, var(--ink);
  color: var(--text); font-family: 'Crimson Pro', Georgia, serif; font-size: 18px; }
main { max-width: 560px; margin: 0 auto; padding: 32px 16px 56px; }
.display { font-family: 'Cinzel', Georgia, serif; }
header { text-align: center; margin-bottom: 26px; }
header .kicker { font-size: 13px; letter-spacing: 0.5em; padding-left: 0.5em; color: var(--gold-mid); }
header h1 { margin: 4px 0 6px; font-size: 34px; font-weight: 900; line-height: 1.05;
  background: linear-gradient(180deg, #fff1b8 8%, var(--gold) 50%, #b0802a 92%); -webkit-background-clip: text; background-clip: text; color: transparent; }
header p { margin: 0; color: var(--muted); font-style: italic; }
.cta { display: block; margin: 0 0 30px; padding: 18px 20px; border-radius: 12px; text-decoration: none; color: var(--text);
  background: linear-gradient(180deg, #1c2c78, #101a4e); box-shadow: 0 0 0 1px var(--gold-deep), 0 0 0 4px var(--gold-mid), 0 0 0 5px var(--gold-deep); }
.cta b { display: block; font-family: 'Cinzel', Georgia, serif; font-size: 19px; color: var(--gold); margin-bottom: 4px; }
.cta span { color: #e9dfc2; font-size: 16.5px; }
.cta .go { display: inline-block; margin-top: 12px; padding: 9px 18px; border-radius: 8px; background: linear-gradient(180deg, #f7dc8a, var(--gold) 40%, var(--gold-mid));
  color: #2a1a03; font-family: 'Cinzel', Georgia, serif; font-weight: 700; font-size: 14px; letter-spacing: 0.06em; }
.cta-free { display: block; margin: -18px 0 30px; text-align: center; color: var(--gold); font-size: 16.5px; }
.more { display: inline-block; margin-top: 8px; color: var(--gold); font-size: 16px; }
.case { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 14px; padding: 16px 0; border-bottom: 1px solid rgba(201,154,53,0.35); }
.case img { width: 88px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 4px; box-shadow: 0 0 0 2px var(--gold-mid); }
.case h2 { margin: 2px 0 2px; font-family: 'Cinzel', Georgia, serif; font-size: 17px; line-height: 1.2; }
.case .date { color: var(--muted); font-size: 14.5px; margin-bottom: 10px; }
.reveal { padding: 9px 16px; border: 0; border-radius: 8px; cursor: pointer; background: var(--wine); color: var(--text);
  box-shadow: inset 0 0 0 1px var(--gold-mid); font-family: 'Cinzel', Georgia, serif; font-weight: 700; font-size: 13px; letter-spacing: 0.06em; }
.locked { color: var(--muted); font-style: italic; font-size: 16px; }
.answer { font-size: 17px; line-height: 1.4; }
.answer b { font-family: 'Cinzel', Georgia, serif; color: var(--gold); }
footer { margin-top: 34px; text-align: center; color: var(--muted); font-size: 15px; }
footer a { color: var(--gold); }
</style>
</head>
<body>
<main>
  <header>
    <div class="kicker display">LOOPED MYSTERIES</div>
    <h1 class="display">THE ANSWERS</h1>
    <p>Tap a case to reveal who did it. New answers unlock a few days after each post.</p>
  </header>
  <div id="cta"></div>
  <div id="list"></div>
  <footer>New mystery almost every day on <a href="https://www.instagram.com/loopedmysteries/">@loopedmysteries</a></footer>
</main>
<script>
const SHOP = {"url": "https://loopedmysteries.gumroad.com/l/halloween-mystery-night", "title": "Hosting a Halloween party?", "text": "Halloween Mystery Night: 6 spooky cases plus invitations, ballot cards and a scoreboard. Print it tonight, play it with friends.", "button": "GET THE PARTY PACK · $2.99", "after_answer": "Solved it? Play 6 spooky cases at your Halloween party"};
const FREE_URL = "";
const UNLOCK_DAYS = 3;
const CASES = [{"id": "alien2", "title": "Who Is the Alien? (The Farmhouse)", "posted": "2026-10-19", "culprit": "E", "who": "The Preacher", "answer": "Look at the church picnic flyer on the fridge: the town's pastor is an old bald man. This young 'preacher' looks like the sketch on the news, his car is parked at the crop circle, and he is holding his Bible upside down."}, {"id": "alien", "title": "Who Is the Alien?", "posted": "2026-10-17", "culprit": "E", "who": "The Glaciologist", "answer": "Look at the team photo: the real Glaciologist wears the same striped scarf, but he has a beard and glasses. Something walked in from that saucer tonight and took his place, almost perfectly."}, {"id": "ghost", "title": "Who Is the Ghost?", "posted": "2026-10-15", "culprit": "D", "who": "The Heiress", "answer": "Look at the mantelpiece: a photograph tied with a black mourning ribbon, and the girl in it is the Heiress. Cats always know. That is why it hisses at her."}, {"id": "train", "title": "Who Is the Vampire? (The Night Train)", "posted": "2026-10-13", "culprit": "E", "who": "The Student in the scarf", "answer": "Read the newspaper: BURIED YESTERDAY, above a photo of the Student. The stain on his scarf is where he was bitten. He died, and he rose again."}, {"id": "vampire", "title": "Who Is the Vampire?", "posted": "2026-10-08", "culprit": "E", "who": "The Countess", "answer": "The portrait on the wall is three hundred years old, and it shows the Countess exactly as she stands tonight, down to the ruby brooch. She has not aged a day."}, {"id": "host", "title": "Who Poisoned the Host?", "posted": "2026-10-02", "culprit": "C", "who": "The Doctor with the medicine case", "answer": "Poison comes in a vial, and the small cap lying beside the host's glass belongs to one. The Doctor is holding a tiny vial right now, and his medicine case is open."}, {"id": "ring", "title": "Who Stole the Ring?", "posted": "2026-10-01", "culprit": "A", "who": "The Groom", "answer": "Everyone else is staring at the empty box. The Groom is looking away, and his left hand stays buried in his pocket. Cold feet, and a ring he was not ready to give."}, {"id": "trophy", "title": "Who Stole the Trophy?", "posted": "2026-09-28", "culprit": "D", "who": "The Technician with the tool belt", "answer": "The ribbon around the stand was torn, and a scrap of the same red ribbon hangs from the Technician's tool belt. The heavy boot print beside it matches his work boots."}, {"id": "necklace", "title": "Who Stole the Necklace?", "posted": "2026-09-27", "culprit": "A", "who": "The Singer in gold sequins", "answer": "The gold star sequin lies inside the empty hollow, exactly where the necklace was. Only a hand reaching in could drop it there, and the Singer's sequinned cuff has a gap."}, {"id": "safe", "title": "Who Opened the Safe?", "posted": "2026-09-26", "culprit": "D", "who": "The Mechanic with oily hands", "answer": "The scratches around the keyhole mean the lock was forced with tools, not opened with a key. The dark smudge is grease, and the Mechanic's fingers are black with it."}, {"id": "painting", "title": "Who Stole the Painting?", "posted": "2026-09-24", "culprit": "B", "who": "The Auctioneer with the red card", "answer": "The painting was unscrewed from its frame, and right beside the screwdriver lies a torn red triangle. It is the missing corner of the Auctioneer's red card."}, {"id": "diamond", "title": "Who Stole the Diamond?", "posted": "2026-09-23", "culprit": "E", "who": "The Security Guard", "answer": "The case is closed and not a single pane is broken, so it was opened with a key and locked again. Only the Security Guard carries the keys."}, {"id": "crown", "title": "Who Stole the Crown?", "posted": "2026-09-22", "culprit": "E", "who": "The Guest with the gift box", "answer": "A crown is far too big for a pocket. The Guest with the gift box is the only one with somewhere to hide it, at a ball where nobody else brought a gift."}];

// Records a click event in GoatCounter when the counter is on; does nothing otherwise.
const track = (path, title) => window.goatcounter && window.goatcounter.count && window.goatcounter.count({ path, title, event: true });

const cta = document.getElementById('cta');
cta.innerHTML = `<a class="cta" href="${SHOP.url}"><b>${SHOP.title}</b><span>${SHOP.text}</span><br /><span class="go">${SHOP.button}</span></a>`
  + (FREE_URL ? `<a class="cta-free" href="${FREE_URL}">Or try 3 printable cases for free →</a>` : '');
cta.querySelector('.cta').addEventListener('click', () => track('click-shop-banner', 'Shop banner'));
cta.querySelector('.cta-free')?.addEventListener('click', () => track('click-free-sample', 'Free sample link'));

const list = document.getElementById('list');
const today = new Date();
for (const c of CASES) {
  const posted = new Date(c.posted + 'T12:00:00');
  const unlock = new Date(posted.getTime() + UNLOCK_DAYS * 86400000);
  const row = document.createElement('div');
  row.className = 'case';
  row.innerHTML = `<img src="img/${c.id}.jpg" alt="" loading="lazy" />
    <div><h2>${c.title}</h2><div class="date">Posted ${posted.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' })}</div><div class="slot"></div></div>`;
  const slot = row.querySelector('.slot');
  if (today < unlock) {
    slot.innerHTML = `<div class="locked">Still under investigation. Answer unlocks on ${unlock.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' })}.</div>`;
  } else {
    const button = document.createElement('button');
    button.className = 'reveal';
    button.textContent = 'REVEAL THE ANSWER';
    button.addEventListener('click', () => {
      track(`reveal-${c.id}`, `Reveal: ${c.title}`);
      slot.innerHTML = `<div class="answer"><b>${c.culprit}</b> · ${c.who}. ${c.answer}</div>
        <a class="more" href="${SHOP.url}">${SHOP.after_answer} →</a>`;
      slot.querySelector('.more').addEventListener('click', () => track(`click-shop-after-${c.id}`, `Shop link after ${c.title}`));
    });
    slot.append(button);
  }
  list.append(row);
}
</script>
</body>
</html>
