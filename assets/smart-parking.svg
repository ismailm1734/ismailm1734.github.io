<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, Arial, sans-serif">
  <rect width="1200" height="675" fill="#0e0e10"/>

  <text x="60" y="56" font-family="'JetBrains Mono', monospace" font-size="16" letter-spacing="2" fill="#7f77dd">SMART PARKING RESERVATION SYSTEM</text>
  <text x="60" y="88" font-size="26" font-weight="700" fill="#ededed">parking_db2 schema</text>
  <text x="60" y="114" font-size="15" fill="#9a9a9f">4 tables &#183; 1 trigger &#183; 1 stored procedure</text>

  <!-- DRIVER -->
  <g>
    <rect x="60" y="150" width="250" height="150" rx="6" fill="#1e1e23" stroke="#2f2f36"/>
    <rect x="60" y="150" width="250" height="34" rx="6" fill="#26262d"/>
    <text x="78" y="173" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ededed">DRIVER</text>
    <text x="78" y="205" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#7f77dd">driver_id  PK</text>
    <text x="78" y="228" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#9a9a9f">name</text>
    <text x="78" y="251" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#9a9a9f">phone</text>
    <text x="78" y="274" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#9a9a9f">email</text>
  </g>

  <!-- PARKING_LOT -->
  <g>
    <rect x="60" y="460" width="250" height="130" rx="6" fill="#1e1e23" stroke="#2f2f36"/>
    <rect x="60" y="460" width="250" height="34" rx="6" fill="#26262d"/>
    <text x="78" y="483" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ededed">PARKING_LOT</text>
    <text x="78" y="515" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#7f77dd">lot_id  PK</text>
    <text x="78" y="538" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#9a9a9f">lot_name</text>
    <text x="78" y="561" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#9a9a9f">capacity</text>
  </g>

  <!-- RESERVATION -->
  <g>
    <rect x="420" y="90" width="300" height="210" rx="6" fill="#1e1e23" stroke="#2f2f36"/>
    <rect x="420" y="90" width="300" height="34" rx="6" fill="#26262d"/>
    <text x="438" y="113" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ededed">RESERVATION</text>
    <text x="438" y="145" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#7f77dd">reservation_id  PK</text>
    <text x="438" y="168" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#9a9a9f">start_time</text>
    <text x="438" y="191" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#9a9a9f">end_time</text>
    <text x="438" y="214" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#9a9a9f">status</text>
    <text x="438" y="237" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#7ee2ab">driver_id  FK</text>
    <text x="438" y="260" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#7ee2ab">spot_id  FK</text>
  </g>

  <!-- PARKING_SPOT -->
  <g>
    <rect x="420" y="430" width="280" height="160" rx="6" fill="#1e1e23" stroke="#2f2f36"/>
    <rect x="420" y="430" width="280" height="34" rx="6" fill="#26262d"/>
    <text x="438" y="453" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ededed">PARKING_SPOT</text>
    <text x="438" y="485" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#7f77dd">spot_id  PK</text>
    <text x="438" y="508" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#9a9a9f">spot_type</text>
    <text x="438" y="531" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#9a9a9f">status</text>
    <text x="438" y="554" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#7ee2ab">lot_id  FK</text>
  </g>

  <!-- relationships -->
  <g stroke="#4a4a55" stroke-width="1.5" fill="none">
    <path d="M 310 195 L 420 175"/>
    <path d="M 310 500 L 420 510"/>
    <path d="M 560 430 L 570 300"/>
  </g>
  <g font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#6b6b72">
    <text x="320" y="190">1</text>
    <text x="405" y="170">N</text>
    <text x="320" y="516">1</text>
    <text x="405" y="506">N</text>
    <text x="577" y="420">N</text>
    <text x="577" y="310">1</text>
  </g>

  <!-- business logic panel -->
  <g>
    <text x="760" y="66" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" fill="#9a9a9f">BUSINESS LOGIC</text>

    <rect x="760" y="86" width="380" height="150" rx="6" fill="#1e1e23"/>
    <text x="782" y="114" font-size="13" font-weight="700" fill="#7f77dd">TRIGGER</text>
    <text x="782" y="136" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ededed">trg_prevent_overlap_reservation</text>
    <text x="782" y="158" font-size="12.5" fill="#9a9a9f">BEFORE INSERT on RESERVATION. Rejects</text>
    <text x="782" y="177" font-size="12.5" fill="#9a9a9f">overlapping bookings on the same spot</text>
    <text x="782" y="196" font-size="12.5" fill="#9a9a9f">(SQLSTATE 45000) and flips the spot to</text>
    <text x="782" y="215" font-size="12.5" fill="#9a9a9f">'occupied' when a booking goes active.</text>

    <rect x="760" y="252" width="380" height="150" rx="6" fill="#1e1e23"/>
    <text x="782" y="280" font-size="13" font-weight="700" fill="#7f77dd">STORED PROCEDURE</text>
    <text x="782" y="302" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ededed">sp_GetDriverReservationStats(id)</text>
    <text x="782" y="324" font-size="12.5" fill="#9a9a9f">Returns a driver's active/completed/</text>
    <text x="782" y="343" font-size="12.5" fill="#9a9a9f">cancelled counts plus their most-used</text>
    <text x="782" y="362" font-size="12.5" fill="#9a9a9f">lot, via a correlated subquery ordered</text>
    <text x="782" y="381" font-size="12.5" fill="#9a9a9f">by reservation count per lot.</text>

    <rect x="760" y="418" width="380" height="172" rx="6" fill="#1e1e23"/>
    <text x="782" y="446" font-size="13" font-weight="700" fill="#7f77dd">STACK</text>
    <text x="782" y="472" font-size="12.5" fill="#9a9a9f">PHP 8 + MySQLi for the relational side,</text>
    <text x="782" y="491" font-size="12.5" fill="#9a9a9f">MongoDB driver for a support-ticket</text>
    <text x="782" y="510" font-size="12.5" fill="#9a9a9f">subsystem. Separate user/ and admin/</text>
    <text x="782" y="529" font-size="12.5" fill="#9a9a9f">front ends, XAMPP-hosted.</text>
  </g>
</svg>
